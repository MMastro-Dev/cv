<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <title>{{ .Site.Title }}</title>

  {{/* Inline critical CSS for fast first paint */}}
  <style>
    {{- readFile "assets/css/main.css" | safeCSS -}}
  </style>

  {{/* Inline print stylesheet */}}
  <style media="print">
    {{- readFile "assets/css/print.css" | safeCSS -}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content" role="main">
    {{ block "content" . }}{{ end }}
  </main>

  <footer role="contentinfo" class="footer">
    <p>
      Last updated: <time datetime="{{ now.Format "2006-01-02" }}">{{ now.Format "January 2, 2006" }}</time>
    </p>
  </footer>
</body>
</html>

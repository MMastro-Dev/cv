name: Build and Deploy CV

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: git.mmastro.dev/maxim/cv

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
          docker login git.mmastro.dev \
            -u ${{ secrets.REGISTRY_USER }} \
            --password-stdin

      - name: Build and push image
        run: |
          docker build \
            --build-arg BASE_URL="${{ secrets.SITE_URL }}" \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ gitea.sha }} .
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ gitea.sha }}

      - name: Deploy container
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no gitea-runner@172.17.0.1 \
            "docker pull ${{ env.IMAGE_NAME }}:latest"
          ssh -o StrictHostKeyChecking=no gitea-runner@172.17.0.1 \
            "docker stop cv"
          ssh -o StrictHostKeyChecking=no gitea-runner@172.17.0.1 \
            "docker rm cv"
          ssh -o StrictHostKeyChecking=no gitea-runner@172.17.0.1 \
            "docker run -d --name cv --network homenet --restart unless-stopped -p 127.0.0.1:8001:80 ${{ env.IMAGE_NAME }}:latest"

      - name: Cleanup old images
        run: docker image prune -f

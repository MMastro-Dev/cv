name: Build and Deploy CV

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derive the full image reference once and reuse it across steps.
      # Image: <registry>/<user>/cv   e.g. gitea.example.com/max/cv
      - name: Set image ref
        id: image
        run: echo "ref=${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USER }}/cv" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login "${{ secrets.REGISTRY_URL }}" \
              --username "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg HUGO_VERSION=0.159.0 \
            --build-arg BASE_URL="${{ secrets.SITE_URL }}" \
            --tag "${{ steps.image.outputs.ref }}:latest" \
            --tag "${{ steps.image.outputs.ref }}:${{ github.sha }}" \
            .

      - name: Push image to registry
        run: |
          docker push "${{ steps.image.outputs.ref }}:latest"
          docker push "${{ steps.image.outputs.ref }}:${{ github.sha }}"

      # -- Deploy to your personal server via SSH ----------------------------
      # The server must have Docker installed and be able to reach the registry.
      # Required Gitea repository secrets (Settings -> Actions -> Secrets):
      #   REGISTRY_URL    -- container registry hostname (e.g. gitea.example.com)
      #   REGISTRY_USER   -- registry username
      #   REGISTRY_TOKEN  -- registry password / API token (packages:read+write)
      #   SITE_URL        -- public URL of the site (e.g. https://cv.example.com)
      #   DEPLOY_HOST     -- server hostname or IP
      #   DEPLOY_USER     -- SSH username
      #   DEPLOY_KEY      -- private SSH key (ed25519 recommended)
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          IMAGE="${{ steps.image.outputs.ref }}:latest"
          REGISTRY="${{ secrets.REGISTRY_URL }}"
          REG_USER="${{ secrets.REGISTRY_USER }}"
          REG_TOKEN="${{ secrets.REGISTRY_TOKEN }}"

          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "printf '%s' '${REG_TOKEN}' | docker login --username '${REG_USER}' --password-stdin '${REGISTRY}' \
             && docker pull '${IMAGE}' \
             && docker stop cv 2>/dev/null; docker rm cv 2>/dev/null \
             && docker run -d --name cv --restart unless-stopped -p 80:80 '${IMAGE}'"

          rm -f ~/.ssh/deploy_key